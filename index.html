    const getHeroFramePath = (idx) => {
      const padded = String(idx).padStart(3, '0');

    function HeroSection({ onOpenCert }) {
      const containerRef = useRef(null);
      const canvasRef = useRef(null);
      const imagesRef = useRef([]);
      const [imagesLoaded, setImagesLoaded] = useState(false);
      const [loadProgress, setLoadProgress] = useState(0);
      const [currentFrame, setCurrentFrame] = useState(1);
      const [scrollProgress, setScrollProgress] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const playIntervalRef = useRef(null);

      // Preload all 123 frames
      useEffect(() => {
        let loaded = 0;
        const images = [];

        for (let i = 1; i <= TOTAL_HERO_FRAMES; i++) {
          const img = new Image();
          img.src = getHeroFramePath(i);
          img.onload = () => {
            loaded++;
            setLoadProgress(Math.round((loaded / TOTAL_HERO_FRAMES) * 100));
            if (loaded === 1) {
              // Draw initial frame immediately
              drawFrame(1);
            }
            if (loaded === TOTAL_HERO_FRAMES) {
              setImagesLoaded(true);
            }
          };
          img.onerror = () => {
            loaded++;
            if (loaded === TOTAL_HERO_FRAMES) {
              setImagesLoaded(true);
            }
          };
          images.push(img);
        }
        imagesRef.current = images;

        return () => {
          if (playIntervalRef.current) clearInterval(playIntervalRef.current);
        };
      }, []);

      // Draw specific frame onto canvas with high-DPI scaling & aspect fit
      const drawFrame = useCallback((frameIndex) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const img = imagesRef.current[frameIndex - 1];
        if (!img || !img.complete || img.naturalWidth === 0) return;

        const dpr = window.devicePixelRatio || 1;
        const displayWidth = canvas.clientWidth;
        const displayHeight = canvas.clientHeight;

        if (canvas.width !== displayWidth * dpr || canvas.height !== displayHeight * dpr) {
          canvas.width = displayWidth * dpr;
          canvas.height = displayHeight * dpr;
        }

        ctx.save();
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, displayWidth, displayHeight);

        // Aspect fit calculation (contain with subtle scale)
        const imgRatio = img.naturalWidth / img.naturalHeight;
        const canvasRatio = displayWidth / displayHeight;
        let renderW, renderH, renderX, renderY;

        if (canvasRatio > imgRatio) {
          renderH = displayHeight;
          renderW = displayHeight * imgRatio;
          renderX = (displayWidth - renderW) / 2;
          renderY = 0;
        } else {
          renderW = displayWidth;
          renderH = displayWidth / imgRatio;
          renderX = 0;
          renderY = (displayHeight - renderH) / 2;
        }

        ctx.drawImage(img, renderX, renderY, renderW, renderH);

        // Ambient dark radial vignette
        const radialGrad = ctx.createRadialGradient(
          displayWidth / 2, displayHeight / 2, Math.min(displayWidth, displayHeight) * 0.25,
          displayWidth / 2, displayHeight / 2, Math.max(displayWidth, displayHeight) * 0.7
        );
        radialGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
        radialGrad.addColorStop(0.7, 'rgba(0, 0, 0, 0.4)');
        radialGrad.addColorStop(1, 'rgba(0, 0, 0, 0.9)');
        ctx.fillStyle = radialGrad;
        ctx.fillRect(0, 0, displayWidth, displayHeight);

        ctx.restore();
      }, []);

      // Scroll listener to update frame and active stage (Silent - no sound while scrolling)
      useEffect(() => {
        const handleScroll = () => {
          if (isPlaying) return; // scroll driven only when not auto-playing
          const container = containerRef.current;
          if (!container) return;

          const rect = container.getBoundingClientRect();
          const scrollableDistance = rect.height - window.innerHeight;
          if (scrollableDistance <= 0) return;

          const progress = Math.max(0, Math.min(1, -rect.top / scrollableDistance));
          setScrollProgress(progress);

          const frameIdx = Math.min(
            TOTAL_HERO_FRAMES,
            Math.max(1, Math.floor(progress * (TOTAL_HERO_FRAMES - 1)) + 1)
          );
          setCurrentFrame(frameIdx);
          drawFrame(frameIdx);
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        window.addEventListener('resize', () => drawFrame(currentFrame), { passive: true });

        handleScroll();
        return () => {
          window.removeEventListener('scroll', handleScroll);
          window.removeEventListener('resize', () => drawFrame(currentFrame));
        };
      }, [isPlaying, currentFrame, drawFrame]);

      // Auto Play Toggle
      const toggleAutoPlay = () => {
        if (isPlaying) {
          if (playIntervalRef.current) clearInterval(playIntervalRef.current);
          setIsPlaying(false);
        } else {
          setIsPlaying(true);
          let frame = currentFrame >= TOTAL_HERO_FRAMES ? 1 : currentFrame;
          playIntervalRef.current = setInterval(() => {
            frame++;
            if (frame > TOTAL_HERO_FRAMES) {
              frame = 1;
            }
            const prog = (frame - 1) / (TOTAL_HERO_FRAMES - 1);
            setScrollProgress(prog);
            setCurrentFrame(frame);
            drawFrame(frame);
          }, 33); // ~30fps
        }
      };

      // Helper to jump scroll to simulator
      const scrollToSimulator = () => {
        const sim = document.getElementById('simulator');
        if (sim) sim.scrollIntoView({ behavior: 'smooth' });
      };

      // Helper to jump scroll to top of hero
      const restartSequence = () => {
        if (isPlaying) {
          clearInterval(playIntervalRef.current);
          setIsPlaying(false);
        }
        const hero = document.getElementById('hero');
        if (hero) hero.scrollIntoView({ behavior: 'smooth' });
        setCurrentFrame(1);
        setScrollProgress(0);
        drawFrame(1);
      };

      // Compute dynamic physics parameters based on scroll progress

    // 5. HIGH-REALISM CANVAS FLUID SIMULATOR
    // ==========================================
    function SimulatorSection({ onCertificateRequest }) {
      const [selectedSpecimen, setSelectedSpecimen] = useState(SPECIMENS[0]);
      const [radius, setRadius] = useState(SPECIMENS[0].defaultRadiusCm);
      const [dropHeight, setDropHeight] = useState(80); // cm
      const [liquid, setLiquid] = useState(LIQUID_TYPES[0]);
      
      // Simulation Run State
      const [isDropping, setIsDropping] = useState(false);
      const [hasDropped, setHasDropped] = useState(false);
      const [showReport, setShowReport] = useState(false);
      const [certCountdown, setCertCountdown] = useState(null);
      const countdownTimerRef = useRef(null);

      // Animated Telemetry Display Numbers (0 at start, animate on drop)
      const [displayDisplaced, setDisplayDisplaced] = useState(0);
      const [displayUsefulness, setDisplayUsefulness] = useState(0);
      const [displayWaterVelocity, setDisplayWaterVelocity] = useState(0);

      const canvasRef = useRef(null);
      const animFrameRef = useRef(null);
      const counterAnimRef = useRef(null);

      // Simulation Internal Physics State Refs
      const simStateRef = useRef({
        running: false,
        phase: 'idle', // 'idle', 'falling', 'submerged'
        object: {
          x: 250,
          y: 35,
          vy: 0,
          radiusPx: 24,
          icon: '🥔',
          density: 1.08,
          shape: 'organic',
          submerged: false,
          settled: false,
        },
        springs: [], // Array of water surface vertices
        particles: [], // Water droplet splash fountain
        splashRings: [], // Expanding surface wave ripples
        bubbles: [], // Underwater air bubbles
        baseWaterY: 220, // Baseline water level
        targetWaterY: 220, // Rises when water is displaced
        basinWidth: 320,
        basinHeight: 150,
        basinX: 90,
        basinY: 170,
        liquidViscosity: 0.025,
        liquidColor: 'rgba(255, 255, 255, 0.14)',
        waveColor: '#ffffff'
      });

      // Volumetric & Mass Calculations
      const volumeMl = useMemo(() => {
        const r = parseFloat(radius);
        let vol = 0;
        if (selectedSpecimen.shape === 'cube') {
          vol = Math.pow(r * 1.6, 3);
        } else if (selectedSpecimen.shape === 'cylinder') {
          vol = Math.PI * Math.pow(r, 2) * (r * 2.2);
        } else {
          vol = (4 / 3) * Math.PI * Math.pow(r, 3);
        }
        return vol;
      }, [radius, selectedSpecimen]);

      const massGrams = useMemo(() => {
        return volumeMl * selectedSpecimen.density;
      }, [volumeMl, selectedSpecimen]);

      const submergedRatio = useMemo(() => {
        const relDensity = selectedSpecimen.density / liquid.density;
        if (relDensity >= 1.0) return 1.0;
        return Math.max(0.15, relDensity);
      }, [selectedSpecimen, liquid]);

      const displacedMl = useMemo(() => {
        return volumeMl * submergedRatio;
      }, [volumeMl, submergedRatio]);

      const splashLossMl = useMemo(() => {
        const kineticE = (selectedSpecimen.density * volumeMl) * (dropHeight / 100);
        return Math.min(displacedMl * 0.35, (kineticE * 0.03));
      }, [selectedSpecimen, volumeMl, dropHeight, displacedMl]);

      const waterVelocity = useMemo(() => {
        const impactV = Math.sqrt(2 * 9.80665 * (dropHeight / 100));
        const densityFactor = Math.min(2.0, 0.75 + 0.25 * Math.sqrt(selectedSpecimen.density / liquid.density));
        return impactV * densityFactor;
      }, [dropHeight, selectedSpecimen, liquid]);

      // Initialize Water Springs Surface
      const initSprings = useCallback((baseY) => {
        const numSprings = 48;
        const width = 320;
        const startX = 90;
        const springs = [];
        for (let i = 0; i < numSprings; i++) {
          springs.push({
            x: startX + (i / (numSprings - 1)) * width,
            y: baseY,
            targetY: baseY,
            vy: 0
          });
        }
        return springs;
      }, []);

      // Start animated digital ticker from 0 to calculated values
      const animateMetricsCountUp = useCallback((targetDisplaced, targetUsefulness, targetVelocity) => {
        if (counterAnimRef.current) cancelAnimationFrame(counterAnimRef.current);
        const startTime = performance.now();
        const duration = 900; // ms

        const step = (now) => {
          const elapsed = now - startTime;
          const progress = Math.min(1, elapsed / duration);
          // Smooth ease-out cubic
          const ease = 1 - Math.pow(1 - progress, 3);

          setDisplayDisplaced(targetDisplaced * ease);
          setDisplayUsefulness(targetUsefulness * ease);
          setDisplayWaterVelocity(targetVelocity * ease);

          if (progress < 1) {
            counterAnimRef.current = requestAnimationFrame(step);
          } else {
            setDisplayDisplaced(targetDisplaced);
            setDisplayUsefulness(targetUsefulness);
            setDisplayWaterVelocity(targetVelocity);
          }
        };

        counterAnimRef.current = requestAnimationFrame(step);
      }, []);

      // Internal Physics and Live Parameters Ref
      const paramsRef = useRef({
        selectedSpecimen,
        radius,
        dropHeight,
        liquid,
        volumeMl,
        displacedMl,
        waterVelocity,
        animateMetricsCountUp
      });

      useEffect(() => {
        paramsRef.current = {
          selectedSpecimen,
          radius,
          dropHeight,
          liquid,
          volumeMl,
          displacedMl,
          waterVelocity,
          animateMetricsCountUp
        };
      }, [selectedSpecimen, radius, dropHeight, liquid, volumeMl, displacedMl, waterVelocity, animateMetricsCountUp]);

      // Reset Simulator Function
      const resetSimulator = useCallback(() => {
        setIsDropping(false);
        setHasDropped(false);
        setShowReport(false);
        if (countdownTimerRef.current) clearInterval(countdownTimerRef.current);
        setCertCountdown(null);

        if (counterAnimRef.current) cancelAnimationFrame(counterAnimRef.current);
        setDisplayDisplaced(0);
        setDisplayUsefulness(0);
        setDisplayWaterVelocity(0);

        const s = simStateRef.current;
        s.phase = 'idle';
        s.baseWaterY = 220;
        s.targetWaterY = 220;
        s.springs = initSprings(220);
        s.particles = [];
        s.splashRings = [];
        s.bubbles = [];
        s.liquidViscosity = liquid.visc;
        s.liquidColor = liquid.color;
        s.waveColor = liquid.waveColor;

        const startY = Math.max(25, 175 - (dropHeight * 1.0));
        s.object = {
          x: 250,
          y: startY,
          vy: 0,
          radiusPx: Math.max(14, Math.min(42, radius * 3.6)),
          icon: selectedSpecimen.icon,
          density: selectedSpecimen.density,
          shape: selectedSpecimen.shape,
          submerged: false,
          settled: false,
        };
      }, [dropHeight, radius, selectedSpecimen, liquid, initSprings]);

      // Update simulator state when controls change while idle
      useEffect(() => {
        if (!isDropping && !hasDropped) {
          resetSimulator();
        }
      }, [selectedSpecimen, radius, dropHeight, liquid, isDropping, hasDropped, resetSimulator]);

      // Main Canvas Render & Physics Loop (Runs continuously without tear-down interruptions)
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let active = true;

        resetSimulator();

        const updatePhysics = () => {
          const s = simStateRef.current;
          const pRef = paramsRef.current;
          const k = 0.035; // spring constant
          const d = 0.028 + (s.liquidViscosity || 0.025); // damping factor
          const spread = 0.25; // wave neighbor spread

          // 1. Update Water Springs
          s.springs.forEach((sp) => {
            const dy = sp.y - sp.targetY;
            const force = -k * dy - d * sp.vy;
            sp.vy += force;
            sp.y += sp.vy;
          });

          // Wave propagation passes (Spring chain interaction)
          const numSprings = s.springs.length;
          for (let p = 0; p < 8; p++) {
            const leftDeltas = new Array(numSprings).fill(0);
            const rightDeltas = new Array(numSprings).fill(0);

            for (let i = 0; i < numSprings; i++) {
              if (i > 0) {
                leftDeltas[i] = spread * (s.springs[i].y - s.springs[i - 1].y);
                s.springs[i - 1].vy += leftDeltas[i];
              }
              if (i < numSprings - 1) {
                rightDeltas[i] = spread * (s.springs[i].y - s.springs[i + 1].y);
                s.springs[i + 1].vy += rightDeltas[i];
              }
            }

            for (let i = 0; i < numSprings; i++) {
              if (i > 0) s.springs[i - 1].y += leftDeltas[i];
              if (i < numSprings - 1) s.springs[i + 1].y += rightDeltas[i];
            }
          }

          // Smoothly raise target water level as displacement takes effect
          s.springs.forEach((sp) => {
            sp.targetY += (s.targetWaterY - sp.targetY) * 0.05;
          });

          // 2. Object Physics & Weight-Scaled Splash Dynamics
          const obj = s.object;
          const centerIdx = Math.floor(numSprings / 2);
          const waterCurrentY = s.springs[centerIdx] ? s.springs[centerIdx].y : s.baseWaterY;

          if (s.phase === 'falling') {
            obj.vy += 0.58; // gravitational acceleration
            obj.y += obj.vy;

            // Check impact with water surface
            if (obj.y + obj.radiusPx >= waterCurrentY) {
              s.phase = 'submerged';
              obj.submerged = true;

              // Calculate Exact Mass in Grams and Weight Factor
              const curVol = pRef.volumeMl;
              const curSpecimen = pRef.selectedSpecimen;
              const totalMassGrams = curVol * curSpecimen.density;
              const weightFactor = Math.max(0.45, Math.min(5.5, Math.pow(totalMassGrams / 280, 0.65)));
              const impactSpeed = obj.vy;

              // Realistic Surface Cavity Impulse
              const kineticImpulse = Math.min(32, (impactSpeed * 1.1) * Math.pow(weightFactor, 0.65));
              const impactSpread = Math.min(12, Math.floor(4 + weightFactor * 1.1));
              for (let i = -impactSpread; i <= impactSpread; i++) {
                const idx = centerIdx + i;
                if (idx >= 0 && idx < numSprings) {
                  const distWeight = Math.cos((i / (impactSpread + 1)) * (Math.PI / 2));
                  s.springs[idx].vy += kineticImpulse * distWeight * 0.88;
                }
              }

              // Sound FX Scaled to Impact Energy & Realistic Specimen Acoustics
              sound.playSpecimenDrop(curSpecimen.id, {
                weightFactor,
                impactSpeed,
                radius: pRef.radius,
                liquid: pRef.liquid,
                volumeMl: curVol
              });

              // 1. Concentric Surface Ripple Waves
              s.splashRings = [
                { x: obj.x, y: waterCurrentY, radius: 4, maxRadius: obj.radiusPx * 1.8 + 12, alpha: 0.9, speed: 2.0 },
                { x: obj.x, y: waterCurrentY, radius: 2, maxRadius: obj.radiusPx * 2.4 + 22, alpha: 0.7, speed: 1.4 },
                { x: obj.x, y: waterCurrentY, radius: 1, maxRadius: obj.radiusPx * 3.0 + 32, alpha: 0.5, speed: 0.9 }
              ];

              // 2. Realistic Fluid Splash Droplets (Dual Symmetrical Crown Wings + Worthington Jet)
              const crownCount = Math.floor(18 + weightFactor * 10);
              const crownSpeedMult = Math.min(2.0, 0.85 + Math.pow(weightFactor, 0.35));

              // Left Crown Spray (Outward parabolic arc to the left)
              for (let i = 0; i < crownCount; i++) {
                const rimOffset = obj.radiusPx * (0.25 + Math.random() * 0.70);
                const angle = -1.85 + (Math.random() - 0.5) * 0.45; // ~ -106 deg
                const spd = (4.0 + Math.random() * (impactSpeed * 0.45 + 3.5)) * crownSpeedMult;
                s.particles.push({
                  x: obj.x - rimOffset,
                  y: waterCurrentY - 4,
                  vx: Math.cos(angle) * spd,
                  vy: Math.sin(angle) * spd,
                  size: Math.random() * 2.2 + 2.0,
                  alpha: 1.0,
                  life: 1.0,
                  gravity: 0.28
                });
              }

              // Right Crown Spray (Outward parabolic arc to the right)
              for (let i = 0; i < crownCount; i++) {
                const rimOffset = obj.radiusPx * (0.25 + Math.random() * 0.70);
                const angle = -1.29 + (Math.random() - 0.5) * 0.45; // ~ -74 deg
                const spd = (4.0 + Math.random() * (impactSpeed * 0.45 + 3.5)) * crownSpeedMult;
                s.particles.push({
                  x: obj.x + rimOffset,
                  y: waterCurrentY - 4,
                  vx: Math.cos(angle) * spd,
                  vy: Math.sin(angle) * spd,
                  size: Math.random() * 2.2 + 2.0,
                  alpha: 1.0,
                  life: 1.0,
                  gravity: 0.28
                });
              }

              // Central Worthington Jet (Vertical Rebound Column)
              const jetCount = Math.floor(14 + weightFactor * 8);
              for (let i = 0; i < jetCount; i++) {
                const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.08; // straight vertical
                const spd = (5.5 + Math.random() * (impactSpeed * 0.55 + 4.5)) * crownSpeedMult;
                s.particles.push({
                  x: obj.x + (Math.random() - 0.5) * 8,
                  y: waterCurrentY - 6,
                  vx: Math.cos(angle) * spd,
                  vy: Math.sin(angle) * spd,
                  size: Math.random() * 2.6 + 2.4,
                  alpha: 1.0,
                  life: 1.0,
                  gravity: 0.30
                });
              }

              // Ambient Micro-Mist Spray
              const mistCount = Math.floor(16 + weightFactor * 8);
              for (let i = 0; i < mistCount; i++) {
                const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.5;
                const spd = (2.0 + Math.random() * 4.0) * crownSpeedMult;
                s.particles.push({
                  x: obj.x + (Math.random() - 0.5) * (obj.radiusPx * 1.2),
                  y: waterCurrentY - 2,
                  vx: Math.cos(angle) * spd,
                  vy: Math.sin(angle) * spd,
                  size: Math.random() * 1.2 + 1.2,
                  alpha: 0.85,
                  life: 0.8,
                  gravity: 0.24
                });
              }

              // Underwater Air Bubbles
              const bubbleCount = Math.floor(Math.min(30, 6 * weightFactor + 6));
              for (let i = 0; i < bubbleCount; i++) {
                s.bubbles.push({
                  x: obj.x + (Math.random() - 0.5) * (obj.radiusPx * 1.3),
                  y: waterCurrentY + 8 + Math.random() * (20 + weightFactor * 6),
                  vx: (Math.random() - 0.5) * (1.2 + weightFactor * 0.2),
                  vy: -Math.random() * 2.0 - 0.5,
                  size: Math.random() * 3.5 + 1.4,
                  alpha: 0.85
                });
              }

              // Rise baseline water level to accommodate displacement
              const targetRise = Math.min(48, Math.max(10, (pRef.displacedMl / 500) * 44));
              s.targetWaterY = 220 - targetRise;

              // Trigger animated digital ticker countdown/up on impact
              pRef.animateMetricsCountUp(
                pRef.displacedMl,
                100 - curSpecimen.uselessnessScore,
                pRef.waterVelocity
              );
            }
          } else if (s.phase === 'submerged') {
            const curLiq = pRef.liquid;
            const relDensity = obj.density / curLiq.density;
            const fluidDrag = 0.86 - (s.liquidViscosity || 0.025) * 0.5;

            if (relDensity >= 1.0) {
              // Sinking Dense Object
              const bottomY = 300 - obj.radiusPx;
              if (obj.y < bottomY) {
                obj.vy += (obj.density - curLiq.density) * 0.12;
                obj.vy *= fluidDrag;
                obj.y += obj.vy;
              } else {
                obj.y = bottomY;
                obj.vy = 0;
                obj.settled = true;
              }
            } else {
              // Floating Buoyant Object
              const equilibriumY = waterCurrentY + (obj.radiusPx * (relDensity * 1.5 - 0.75));
              const springToEq = (equilibriumY - obj.y) * 0.08;
              obj.vy += springToEq;
              obj.vy *= fluidDrag;
              obj.y += obj.vy;

              if (Math.abs(obj.vy) < 0.08 && Math.abs(equilibriumY - obj.y) < 1.0) {
                obj.settled = true;
              }
            }
          }

          // 3. Update Splash Droplet Particles
          for (let i = s.particles.length - 1; i >= 0; i--) {
            const p = s.particles[i];
            p.vx *= 0.992; // fluid air drag
            p.vy += p.gravity;
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.0075; // smooth ~2.2s flight
            p.alpha = Math.max(0, Math.min(1, p.life * 1.4));

            // Check surface contact at droplet's horizontal position
            const relX = (p.x - 90) / 320;
            const spIdx = Math.max(0, Math.min(numSprings - 1, Math.floor(relX * numSprings)));
            const localWaterY = s.springs[spIdx] ? s.springs[spIdx].y : s.baseWaterY;

            if (p.y >= localWaterY && p.vy > 0 && p.y > 180) {
              if (s.springs[spIdx]) {
                s.springs[spIdx].vy += Math.min(3, p.vy * 0.08);
              }
              s.particles.splice(i, 1);
            } else if (p.life <= 0 || p.y > 330 || p.x < 50 || p.x > 450) {
              s.particles.splice(i, 1);
            }
          }

          // 4. Update Surface Splash Wave Rings
          for (let i = s.splashRings.length - 1; i >= 0; i--) {
            const r = s.splashRings[i];
            r.radius += r.speed;
            r.alpha -= 0.018;
            if (r.alpha <= 0 || r.radius >= r.maxRadius) {
              s.splashRings.splice(i, 1);
            }
          }

          // 5. Update Underwater Bubbles
          for (let i = s.bubbles.length - 1; i >= 0; i--) {
            const b = s.bubbles[i];
            b.x += b.vx + Math.sin(Date.now() * 0.01 + i) * 0.2;
            b.y += b.vy;
            if (b.y <= waterCurrentY) {
              s.bubbles.splice(i, 1);
            }
          }
        };

        const renderCanvas = () => {
          ctx.clearRect(0, 0, 500, 320);
          const s = simStateRef.current;
          const pRef = paramsRef.current;
          const numSprings = s.springs.length;
          if (numSprings === 0) return;

          // Background Guide Grid & Measurement Scale
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
          ctx.lineWidth = 1;
          for (let y = 60; y <= 280; y += 40) {
            ctx.beginPath();
            ctx.setLineDash([4, 6]);
            ctx.moveTo(90, y);
            ctx.lineTo(410, y);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          // Altitude Drop Marker
          const dropMarkerY = Math.max(25, 175 - (pRef.dropHeight * 1.0));
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.setLineDash([2, 4]);
          ctx.beginPath();
          ctx.moveTo(90, dropMarkerY);
          ctx.lineTo(410, dropMarkerY);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
          ctx.font = '9px "JetBrains Mono", monospace';
          ctx.fillText(`ALTITUDE ${pRef.dropHeight}cm`, 320, dropMarkerY - 4);

          // Render Chamber Glass Basin Contour
          ctx.strokeStyle = '#3f3f46';
          ctx.lineWidth = 2;
          ctx.fillStyle = '#09090b';
          ctx.beginPath();
          ctx.roundRect(90, 170, 320, 140, [0, 0, 48, 48]);
          ctx.fill();
          ctx.stroke();

          // Render Underwater Bubbles
          s.bubbles.forEach((b) => {
            ctx.fillStyle = `rgba(255, 255, 255, ${b.alpha})`;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
            ctx.fill();
          });

          // Render Submerged / Dropping Object
          const obj = s.object;
          ctx.save();
          ctx.font = `${Math.floor(obj.radiusPx * 1.8)}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(obj.icon, obj.x, obj.y);
          ctx.restore();

          // Render Dynamic Fluid Body & Surface Spline
          ctx.save();
          ctx.beginPath();
          ctx.moveTo(s.springs[0].x, s.springs[0].y);

          for (let i = 0; i < numSprings - 1; i++) {
            const p0 = s.springs[i];
            const p1 = s.springs[i + 1];
            const xc = (p0.x + p1.x) / 2;
            const yc = (p0.y + p1.y) / 2;
            ctx.quadraticCurveTo(p0.x, p0.y, xc, yc);
          }
          ctx.lineTo(s.springs[numSprings - 1].x, s.springs[numSprings - 1].y);
          ctx.lineTo(410, 310);
          ctx.lineTo(90, 310);
          ctx.closePath();

          // Fluid Fill Gradient
          const fluidGrad = ctx.createLinearGradient(0, 170, 0, 310);
          fluidGrad.addColorStop(0, pRef.liquid.color || s.liquidColor);
          fluidGrad.addColorStop(1, 'rgba(255, 255, 255, 0.04)');
          ctx.fillStyle = fluidGrad;
          ctx.fill();

          // Fluid Surface Line Glow
          ctx.strokeStyle = pRef.liquid.waveColor || s.waveColor;
          ctx.lineWidth = 2.0;
          ctx.beginPath();
          ctx.moveTo(s.springs[0].x, s.springs[0].y);
          for (let i = 0; i < numSprings - 1; i++) {
            const p0 = s.springs[i];
            const p1 = s.springs[i + 1];
            const xc = (p0.x + p1.x) / 2;
            const yc = (p0.y + p1.y) / 2;
            ctx.quadraticCurveTo(p0.x, p0.y, xc, yc);
          }
          ctx.lineTo(s.springs[numSprings - 1].x, s.springs[numSprings - 1].y);
          ctx.stroke();
          ctx.restore();

          // Render Surface Splash Wave Rings
          const centerWaterY = s.springs[Math.floor(numSprings / 2)].y;
          s.splashRings.forEach((ring) => {
            ctx.save();
            ctx.strokeStyle = `rgba(255, 255, 255, ${ring.alpha * 0.8})`;
            ctx.lineWidth = 2.0;
            ctx.beginPath();
            ctx.ellipse(ring.x, centerWaterY, ring.radius, ring.radius * 0.22, 0, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          });

          // Render High-Contrast Water Droplets (Glossy, 3D Pearl Spheres)
          s.particles.forEach((p) => {
            ctx.save();
            
            // 1. Subtle Glow Shadow
            ctx.shadowColor = 'rgba(255, 255, 255, 0.6)';
            ctx.shadowBlur = 4;

            // 2. Main Water Bead Body
            ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha * 0.95})`;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fill();

            // 3. 3D Specular Highlight / Pearl Reflection
            if (p.size > 2.0) {
              ctx.shadowBlur = 0;
              ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
              ctx.beginPath();
              ctx.arc(p.x - p.size * 0.3, p.y - p.size * 0.3, p.size * 0.35, 0, Math.PI * 2);
              ctx.fill();
            }

            // 4. Soft Liquid Teardrop Elongation in Flight
            if (Math.abs(p.vy) > 1.8 && p.size > 1.6) {
              const speed = Math.hypot(p.vx, p.vy);
              if (speed > 0.1) {
                const angle = Math.atan2(p.vy, p.vx);
                ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha * 0.45})`;
                ctx.beginPath();
                ctx.ellipse(
                  p.x - (p.vx / speed) * p.size * 0.5,
                  p.y - (p.vy / speed) * p.size * 0.5,
                  p.size * 0.7,
                  p.size * 1.25,
                  angle - Math.PI / 2,
                  0,
                  Math.PI * 2
                );
                ctx.fill();
              }
            }
            ctx.restore();
          });
        };

        const tick = () => {
          if (!active) return;
          updatePhysics();
          renderCanvas();
          animFrameRef.current = requestAnimationFrame(tick);
        };

        animFrameRef.current = requestAnimationFrame(tick);

        return () => {
          active = false;
          if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
          if (counterAnimRef.current) cancelAnimationFrame(counterAnimRef.current);
        };
      }, [initSprings, resetSimulator]);
